table: friction_map
description: "Mapa analítico consolidado de atritos por aspecto, intensidade média e tendência temporal por semestre"
granularity: "um aspecto por semestre"
produced_by: "ml.sentiment.friction_map"
consumers: ["synthetic.generate", "agent.pipeline", "app", "ml.impact"]
columns:
  - name: friction_id
    dtype: string
    nullable: false
    description: "Identificador único da linha (aspecto + semestre)"
    unit: null
    source: "ml/sentiment/friction_map.py"
    sensitive: false
    example: "atraso_2024S1"
  - name: aspect
    dtype: string
    nullable: false
    description: "Aspecto do atrito analisado (atraso, bagagem, atendimento, app_checkin, resgate_milhas, preco, conforto)"
    unit: null
    source: "ml/sentiment/friction_map.py"
    sensitive: false
    example: "atraso"
  - name: semester
    dtype: string
    nullable: false
    description: "Semestre do período de referência (ex: 2024-S1)"
    unit: null
    source: "ml/sentiment/friction_map.py"
    sensitive: false
    example: "2024-S1"
  - name: mention_count
    dtype: int
    nullable: false
    description: "Total de avaliações que mencionaram este aspecto no semestre"
    unit: contagem
    source: "ml/sentiment/friction_map.py"
    sensitive: false
    example: 85
  - name: negative_count
    dtype: int
    nullable: false
    description: "Quantidade de avaliações com polaridade negativa neste aspecto no semestre"
    unit: contagem
    source: "ml/sentiment/friction_map.py"
    sensitive: false
    example: 62
  - name: neutral_count
    dtype: int
    nullable: false
    description: "Quantidade de avaliações com polaridade neutra neste aspecto no semestre"
    unit: contagem
    source: "ml/sentiment/friction_map.py"
    sensitive: false
    example: 10
  - name: positive_count
    dtype: int
    nullable: false
    description: "Quantidade de avaliações com polaridade positiva neste aspecto no semestre"
    unit: contagem
    source: "ml/sentiment/friction_map.py"
    sensitive: false
    example: 13
  - name: negative_rate
    dtype: float
    nullable: false
    description: "Taxa de menções negativas sobre o total de menções do aspecto no semestre"
    unit: taxa
    source: "ml/sentiment/friction_map.py"
    sensitive: false
    example: 0.729
  - name: semester_intensity
    dtype: float
    nullable: false
    description: "Intensidade calculada do atrito no semestre (combinação de prevalência e negatividade, 0 a 1)"
    unit: indice_0_1
    source: "ml/sentiment/friction_map.py"
    sensitive: false
    example: 0.684
  - name: mean_intensity
    dtype: float
    nullable: false
    description: "Intensidade média global deste aspecto ao longo de toda a janela histórica"
    unit: indice_0_1
    source: "ml/sentiment/friction_map.py"
    sensitive: false
    example: 0.650
  - name: delta_previous
    dtype: float
    nullable: false
    description: "Variação da intensidade em relação ao semestre imediatamente anterior"
    unit: delta
    source: "ml/sentiment/friction_map.py"
    sensitive: false
    example: 0.042
  - name: trend_direction
    dtype: string
    nullable: false
    description: "Direção da tendência temporal do atrito (crescente, decrescente, estavel)"
    unit: null
    source: "ml/sentiment/friction_map.py"
    sensitive: false
    example: "crescente"
  - name: aspect_weight
    dtype: float
    nullable: false
    description: "Peso calibrado do aspecto exportado para friction_weights.json (soma dos pesos = 1.0)"
    unit: peso_normalizado
    source: "ml/sentiment/friction_map.py"
    sensitive: false
    example: 0.220
checks:
  unique: [friction_id]
  non_null:
    - friction_id
    - aspect
    - semester
    - mention_count
    - negative_count
    - neutral_count
    - positive_count
    - negative_rate
    - semester_intensity
    - mean_intensity
    - delta_previous
    - trend_direction
    - aspect_weight
  allowed_values:
    aspect: [atraso, bagagem, atendimento, app_checkin, resgate_milhas, preco, conforto]
    trend_direction: [crescente, decrescente, estavel]
  custom:
    - name: valid_semester_intensity_range
      expr: "MIN(semester_intensity) >= 0.0 AND MAX(semester_intensity) <= 1.0"
      message: "Intensidade semestral deve estar entre 0.0 e 1.0"
    - name: valid_aspect_weight_range
      expr: "MIN(aspect_weight) >= 0.0 AND MAX(aspect_weight) <= 1.0"
      message: "Peso de atrito deve estar entre 0.0 e 1.0"
