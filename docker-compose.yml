# =============================================================================
# PROJETO AURA 2.0 - Docker Compose
# Cockpit Executivo de Produção (Next.js 15)
# =============================================================================

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - AURA_LLM_API_KEY=${AURA_LLM_API_KEY:-}
      - AURA_LLM_BASE_URL=${AURA_LLM_BASE_URL:-http://localhost:20128/v1}
      - AURA_LLM_MODEL=${AURA_LLM_MODEL:-principal-combo}
      - AURA_LLM_MAX_TOKENS=${AURA_LLM_MAX_TOKENS:-4096}
    volumes:
      # Monta data/analytics para permitir leitura atualizada dos modelos e persistência do dual-write
      - ./data/analytics:/app/data/analytics:rw
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/portfolio/summary || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
