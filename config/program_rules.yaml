# =============================================================================
# Azul Fidelidade - snapshot versionado das regras do programa
# =============================================================================
# PROPÓSITO: fonte única de verdade consumida por
#   (a) gerador sintético      (synthetic/)
#   (b) motor de elegibilidade  (agent/eligibility.py)
#   (c) base de conhecimento do RAG (agent/rag/) - citações com id + vigência
#   (d) painel (app/)          (tier cards, cores, metas)
#
# HONESTIDADE METODOLÓGICA (crítico):
#   Este snapshot foi compilado por PESQUISA WEB em 12/10/2026 a partir de
#   fontes oficiais da Azul e imprensa especializada, porque o site oficial
#   bloqueia captura automática (HTTP 403 / Akamai - verificado nesta sessão).
#   NÃO é uma captura oficial do regulamento. Cada bloco de fatos carrega
#   `verification_status` e `valid_from`.
#
#   Quando houver um snapshot manual (HTML/PDF) do regulamento:
#     1. coloque o arquivo em data/raw/_manual/
#     2. registre-o no manifesto (ingestion.register --manual)
#     3. atualize os fatos abaixo e incremente `snapshot_version`
#     4. rode `python tasks.py rag` para reindexar
# =============================================================================

meta:
  program_name: "Azul Fidelidade"
  former_name: "TudoAzul"
  renamed_at: "2024-04-01"
  snapshot_version: "research-2026-10-12"
  snapshot_status: "provisional"
  snapshot_method: >-
    Compilação via pesquisa web (12/10/2026): páginas oficiais da Azul,
    comunicados corporativos, documento arquivado na SEC e imprensa
    especializada. Captura direta do site oficial bloqueada (HTTP 403).
  policy:
    null_semantics: >-
      Valor `null` = regra NÃO confirmada para a vigência de referência.
      O motor de elegibilidade deve tratar todo valor null como INELEGÍVEL
      (fail-safe) e sinalizar para revisão humana; nunca inferir.
    citation_rule: >-
      Toda recomendação do agente deve citar: fact_id, texto do fato,
      verification_status, valid_from e snapshot_version deste arquivo.

