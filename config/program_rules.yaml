program_facts:
  qualifying_points:
    id: AF-QUALIFYING-POINTS
    description: "Como se acumulam pontos qualificáveis (definem o nível; distintos dos Pontos Azul de resgate)"
    rules:
      flight_and_eligible_services: "R$ 1 gasto em passagens e serviços elegíveis = 1 ponto qualificável"
      eligible_services: ["bagagem", "Espaço Azul", "Economy Xtra", "marcação antecipada de assento", "upgrade de cabine"]
      card_azul_itau: "a cada 10 Pontos Azul acumulados = 1 ponto qualificável"
      clube_azul: "a cada 10 Pontos Azul acumulados = 1 ponto qualificável"
      purchased_points_generate_qualifying: false
    verification_status: official_historical
    valid_from: "2024-04-01"
    sources: [S2, S9]

  points_purchase:
    id: AF-POINTS-PURCHASE
    description: "Condições de compra de Pontos Azul"
    rules:
      min_points_per_order: 1000
      max_points_per_12_months: 100000
      standard_price_brl_per_point: 0.07
      credit_deadline_hours: 24
    verification_status: official_current_partial
    sources: [S7]

  redemption:
    id: AF-REDEMPTION
    description: "Uso de Pontos Azul"
    rules:
      min_points_per_flight_segment: 3000
      redemption_uses:
        - "Passagens aéreas da Azul"
        - "Passagens em companhias parceiras"
        - "Hospedagens"
        - "Produtos e serviços do Shopping Azul"
        - "Outras opções de parceiros"
      note: "Disponibilidade e preço efetivo dependem do produto e das condições da oferta."
    verification_status: official_current_partial
    sources: [S1]

  resgate_especial_2025:
    id: AF-RESGATE-ESPECIAL-2025
    description: "Resgate Especial Azul - cotas anuais de passagem nacional por valor fixo em pontos"
    rules:
      safira: { annual_vouchers: 5, points_per_segment: 70000 }
      diamante: { annual_vouchers: 10, points_per_segment: 50000 }
    verification_status: official_current_partial
    valid_from: "2025-02"
    notes: "Cotas anuais; elegibilidade e utilização sujeitas a condições específicas do regulamento do benefício."
    sources: [S8]

  passagem_cortesia_2026:
    id: AF-PASSAGEM-CORTESIA-2026
    description: "Retomada da emissão de Passagem Cortesia com pontos e Pontos + Reais"
    rules:
      eligible_publics:
        - "Clientes Diamante Unique"
        - "Clientes Diamante (condições aplicáveis)"
        - "Determinados portadores de cartões Azul Itaú"
        - "Integrantes do Azul One"
      exclusive_channel: "WhatsApp exclusivo para clientes Diamante Unique"
    verification_status: official_current_partial
    valid_from: "2026-02-27"
    sources: [S4]

  azul_one:
    id: AF-AZUL-ONE
    description: "Azul One - grupo por convite (NÃO é um nível ordinal)"
    rules:
      access: "Convite anual e nominal, considerando o relacionamento do cliente"
      not_achievable_by_points: true
    verification_status: official_current
    sources: [S1, S3]

  points_validity_transition:
    id: AF-VALIDITY-TRANSITION
    description: "Transição de validade na reformulação"
    rules:
      points_earned_after: "2024-04-01"       # validade conforme nível no momento do acúmulo
